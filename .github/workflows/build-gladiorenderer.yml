name: Build gladiorenderer package

on:
  push:
    branches:
      - master
    paths:
      - 'x11-packages/gladiorenderer/**'
      - '.github/workflows/build-gladiorenderer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-gladiorenderer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build gladiorenderer
        env:
          TERMUX_PKG_MAINTAINER: "@as14725836"
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 -f gladiorenderer

      - name: Collect debs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          # Only package our own artifact. Dependency debs also land in
          # output/, but some carry an epoch in the version which breaks
          # artifact upload because ':' is not valid in an artifact path.
          found=0
          for f in output/gladiorenderer_*.deb; do
            [ -e "$f" ] || continue
            cp "$f" out/
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "::error::no gladiorenderer .deb produced"
            exit 1
          fi
          ls -la out
          (cd out && sha256sum ./*.deb > SHA256SUMS)
          cat out/SHA256SUMS

      - name: Show package contents
        if: always()
        run: |
          set -euo pipefail
          for deb in out/*.deb; do
            echo "=== $deb ==="
            dpkg-deb -c "$deb" || true
            echo "--- control ---"
            dpkg-deb -I "$deb" || true
          done

      - name: Upload deb artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gladiorenderer-debs-aarch64
          path: out/
          if-no-files-found: warn

  release:
    permissions:
      contents: write
    needs: build
    if: |
      always() &&
      github.ref == 'refs/heads/master' &&
      !cancelled()
    runs-on: ubuntu-slim
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Flatten debs
        run: |
          set -euo pipefail
          mkdir -p release
          find ./artifacts -name '*.deb' -exec cp {} release/ \;
          ls -la release/
          (cd release && sha256sum ./*.deb | sort -k2 > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^TERMUX_PKG_VERSION=' x11-packages/gladiorenderer/build.sh | cut -d= -f2 | tr -d '"')"
          REVISION="$(grep -m1 '^TERMUX_PKG_REVISION=' x11-packages/gladiorenderer/build.sh | cut -d= -f2 | tr -d '"')"
          [ -n "$REVISION" ] || REVISION=0
          TAG="gladiorenderer-${VERSION}-${REVISION}"
          echo "TAG=$TAG"

          cat > notes.md <<'EOF'
          gladiorenderer (Gladio renderer server) for Termux aarch64

          This is the **server** half of gladio. It is the process that turns the
          OpenGL calls a Windows application makes into GLES calls, and presents
          the result through X11.

          The app-facing half is the gladio **client** (`libGL.so`), which lives
          inside the Wine rootfs and publishes its requests over a Unix socket.
          This package does not include it.

          Contents:

          - `gladio-cli` -> `$PREFIX/bin`

          Install:

          ```
          pkg install ./gladiorenderer_*.deb
          ```

          Usage (start the server *before* the client; the client connects once
          from inside `glXGetProcAddress()` and does not retry in-process):

          ```
          gladio-cli -s "$PREFIX/tmp/.gladio/G0"
          ```

          Point the client's `X11_SERVER_PATH` at the same socket.

          Requires Termux:X11 for presentation, and a GL driver that supports
          GLSL ES 3.20 (the renderer generates ES 3.2 shaders). Frames are read
          back with `glReadPixels`; XShm is used for the transfer to the X server
          when the extension is available, with a plain `XPutImage` fallback.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.deb release/SHA256SUMS --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file notes.md \
              release/*.deb release/SHA256SUMS
          fi
