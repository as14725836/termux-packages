name: Build glava packages

on:
  push:
    branches:
      - master
    paths:
      - 'x11-packages/glava/**'
      - 'packages/glava-audio/**'
      - '.github/workflows/build-glava.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-glava
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target_arch: [aarch64, arm, x86_64]
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build glava
        env:
          TERMUX_PKG_MAINTAINER: "@as14725836"
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./build-package.sh -a ${{ matrix.target_arch }} -f glava

      - name: Collect debs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          # Only package our own artifact. Dependency debs are also placed in
          # output/, but some of them carry an epoch in the version
          # (e.g. libblocksruntime_1:6.4.0) which would break the artifact
          # uploader because ':' is not a valid character in an artifact path.
          found=0
          for f in output/glava_*.deb; do
            [ -e "$f" ] || continue
            cp "$f" out/
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "::error::no glava .deb produced for ${{ matrix.target_arch }}"
            exit 1
          fi
          ls -la out
          (cd out && sha256sum ./*.deb > SHA256SUMS)
          cat out/SHA256SUMS

      - name: Upload deb artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glava-debs-${{ matrix.target_arch }}
          path: out/
          if-no-files-found: warn

  build-audio:
    # glava-audio only installs a shell script and a config file, so it is
    # arch-independent and has to be built exactly once. Building it per arch
    # drags the pulseaudio/sox dependency chain in from source on architectures
    # where the prebuilt debs are older, and that chain currently fails on
    # libmad 0.16.5 with "CMake Error at CMakeLists.txt:86 (if): ASO and FALSE".
    runs-on: ubuntu-26.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build glava-audio
        env:
          TERMUX_PKG_MAINTAINER: "@as14725836"
        run: |
          set -euo pipefail
          # -I downloads the pulseaudio dependency chain as prebuilt debs from
          # the Termux repository. Building that chain from source inside this
          # package hits a buildorder.py ordering problem where libsndfile is
          # scheduled after pulseaudio even though pulseaudio depends on it,
          # which makes pulseaudio's meson fail on "Dependency sndfile not
          # found".
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 -I -f glava-audio

      - name: Collect debs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          found=0
          for f in output/glava-audio_*.deb; do
            [ -e "$f" ] || continue
            cp "$f" out/
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "::error::no glava-audio .deb produced"
            exit 1
          fi
          ls -la out
          (cd out && sha256sum ./*.deb > SHA256SUMS)
          cat out/SHA256SUMS

      - name: Upload deb artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glava-debs-audio
          path: out/
          if-no-files-found: warn

  release:
    permissions:
      contents: write
    needs: [build, build-audio]
    if: |
      always() &&
      github.ref == 'refs/heads/master' &&
      !cancelled()
    runs-on: ubuntu-slim
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Flatten debs
        run: |
          set -euo pipefail
          mkdir -p release
          find ./artifacts -name '*.deb' -exec cp {} release/ \;
          ls -la release/
          (cd release && sha256sum ./*.deb | sort -k2 > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^TERMUX_PKG_VERSION=' x11-packages/glava/build.sh | cut -d= -f2 | tr -d '"')"
          REVISION="$(grep -m1 '^TERMUX_PKG_REVISION=' x11-packages/glava/build.sh | cut -d= -f2 | tr -d '"')"
          [ -n "$REVISION" ] || REVISION=0
          TAG="glava-${VERSION}-${REVISION}"
          echo "TAG=$TAG"

          cat > notes.md <<'EOF'
          glava + glava-audio for Termux (x11-repo)

          `glava` (audio visualiser):
          - PulseAudio replaced by the built-in FIFO audio backend (`glava -a fifo`)
          - Built with `-Ddisable_pulse=true`; no libpulse dependency
          - Non-executable stack (`-Wl,-z,noexecstack`) for Android
          - Requires: termux-x11 + Mesa (GLX)

          `glava-audio` (audio bridge helper):
          - Routes all PulseAudio output into a raw PCM FIFO so glava can
            visualise system audio (music, video, Wine games)
          - Chain: app -> null-sink -> loopback -> pipe-sink -> $PREFIX/tmp/glava.fifo
          - Ships sox based test tones (`glava-audio test-bass`)

          Install:

          ```
          pkg install ./glava_*.deb ./glava-audio_*.deb
          ```

          Quick start:

          ```
          glava-audio start      # start the PulseAudio bridge
          glava-audio glava      # launch the visualiser
          glava-audio test-bass  # play a test tone
          ```
          EOF
          sed -i 's/^          //' notes.md

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "glava + glava-audio ${VERSION}-${REVISION}" \
            --notes-file notes.md \
            release/*.deb release/SHA256SUMS
