# glava-audio —— PulseAudio 桥配置模板
# 由 glava-audio 脚本使用（自动替换 @TERMUX_PREFIX@ 与 @RATE@）。
#
# 链路：应用 → glava_mix(null-sink) → loopback → glava_fifo(pipe-sink) → FIFO
#
# 注意：pulseaudio 的配置文件不支持反斜杠续行，每条 load-module 必须写在一行。

# 1) 虚拟混音总输出：所有应用的声音都送到这里
load-module module-null-sink sink_name=glava_mix sink_properties=device.description=GlavaMix

# 2) 把混音写成裸 PCM 到 FIFO（glava 的 fifo 后端按 s16le/2ch 读取）
load-module module-pipe-sink sink_name=glava_fifo file=@TERMUX_PREFIX@/tmp/glava.fifo format=s16le rate=@RATE@ channels=2

# 3) 设为默认输出，新启动的程序自动往里送
set-default-sink glava_fifo

# 4) 把 glava_mix 的 monitor 环回到 glava_fifo
load-module module-loopback source=glava_mix.monitor sink=glava_fifo
